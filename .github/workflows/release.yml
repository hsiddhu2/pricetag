name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write   # npm trusted publishing (OIDC), no token stored anywhere
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm install -g npm@latest   # trusted publishing needs npm 11.5.1+
      - run: npm test
      - name: Check tag matches package version
        run: |
          V=$(node -p "require('./package.json').version")
          [ "refs/tags/v$V" = "$GITHUB_REF" ] || { echo "tag $GITHUB_REF does not match package.json version $V"; exit 1; }
      - name: Publish to npm (skipped if this version is already there)
        run: |
          N=$(node -p "require('./package.json').name"); V=$(node -p "require('./package.json').version")
          if [ "$(npm view "$N@$V" version 2>/dev/null)" = "$V" ]; then echo "$N@$V already on npm, skipping publish"
          else npm publish --provenance --access public; fi
      - name: Move the v0 major tag
        run: |
          MAJOR=v$(node -p "require('./package.json').version.split('.')[0]")
          git tag -f "$MAJOR" && git push -f origin "$MAJOR"
      - name: Release notes from CHANGELOG.md
        run: |
          V=$(node -p "require('./package.json').version")
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          printf '\n```bash\nnpm install -g pricetag-cli\n```\n' >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
