name: pricetag
description: Post a short agent-usage summary on each pull request, built from the usage recorded in the repo's commits.
branding:
  icon: tag
  color: orange
inputs:
  base:
    description: Base branch for the summary. Defaults to the pull request's base branch.
    required: false
    default: ''
  github-token:
    description: Token used to post the comment.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '20'
    - name: Post usage summary
      if: github.event_name == 'pull_request'
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BASE: ${{ inputs.base != '' && inputs.base || github.event.pull_request.base.ref }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        git fetch --no-tags origin "$BASE" 2>/dev/null || true
        git fetch origin 'refs/notes/pricetag:refs/notes/pricetag' 2>/dev/null || true
        node "${{ github.action_path }}/bin/pricetag.js" pr --base "$BASE" > /tmp/pricetag-comment.md
        printf '\n<!-- pricetag-usage -->\n' >> /tmp/pricetag-comment.md
        cat /tmp/pricetag-comment.md
        ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate -q '[.[] | select(.body | contains("<!-- pricetag-usage -->"))] | first | .id // empty')
        if [ -n "$ID" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@/tmp/pricetag-comment.md > /dev/null || echo "pricetag: could not update the comment (fork PR or read-only token)"
        else
          gh api "repos/$REPO/issues/$PR/comments" -F body=@/tmp/pricetag-comment.md > /dev/null || echo "pricetag: could not post the comment (fork PR or read-only token)"
        fi
